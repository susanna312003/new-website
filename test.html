<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page</title>
  
  <!-- Google Fonts Preconnect & Import -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jacques+Francois+Shadow&family=Special+Elite&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .container {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 60px;
      width: 90%;
      max-width: 1200px;
      padding: 20px;
    }

    .card-link {
      text-decoration: none;
      color: inherit;
      display: block;
      transition: transform 0.25s ease;
    }

    .card-link:hover {
      transform: translateY(-5px);
    }

    /* Shared Overlay Pseudo-element for Images */
    .card-rectangular::after,
    .card-oval::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.5); /* Semi-transparent white overlay */
      z-index: 2;
      pointer-events: none;
    }

    /* Utility Font Classes */
    .jacques-francois-shadow-regular {
      font-family: "Jacques Francois Shadow", serif;
      font-weight: 400;
      font-style: normal;
    }

    .special-elite-regular {
      font-family: "Special Elite", system-ui;
      font-weight: 400;
      font-style: normal;
    }

    /* Professional Work Card */
    .card-rectangular {
      width: 450px;
      height: 300px;
      border: 1px solid #000000;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
    }

    .card-rectangular img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .card-rectangular .overlay-text {
      position: relative;
      z-index: 3;
      font-size: 1.8rem;
      font-weight: 500;
      color: #000000;
      text-align: center;
    }

    /* Personal Creative Endeavors Card */
    .card-oval {
      width: 480px;
      height: 300px;
      border: 1px solid #000000;
      border-radius: 50%;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
    }

    .card-oval img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .card-oval .overlay-text {
      position: relative;
      z-index: 3;
      font-size: 1.5rem;
      color: #000000;
      text-align: center;
      padding: 0 20px;
    }

    /* Mobile Responsiveness */
    @media (max-width: 900px) {
      .container {
        flex-direction: column;
        gap: 40px;
      }

      .card-rectangular,
      .card-oval {
        width: 100%;
        max-width: 400px;
        height: 260px;
      }
    }
  </style>
</head>
<body>

  <main class="container">
    <a href="professional-work.html" class="card-link">
      <div class="card-rectangular">
        <img src="images/8.18.26 crescent city map without labels.png" alt="Professional Work Background">
        <span class="overlay-text jacques-francois-shadow-regular">professional work</span>
      </div>
    </a>

    <a href="personal-creative.html" class="card-link">
      <div class="card-oval">
        <img src="images/Screenshot 2026-09-05 103240.png" alt="Personal Creative Endeavors Background">
        <span class="overlay-text special-elite-regular">personal creative endeavors</span>
      </div>
    </a>
  </main>

</body>
</html>
